name: Build the Play bundle
# Builds out/aab/Ringdown.aab with a throwaway key. The bundle is re-signed with the real
# upload key outside CI (the key never goes to GitHub).
on:
  push:
    branches: [build-1.3.2]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          url=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/google/bundletool/releases/latest \
            | jq -r '.assets[] | select(.name | startswith("bundletool-all")) | .browser_download_url' | head -1)
          echo "bundletool: $url"
          curl -fsSL -o buildtools/bundletool.jar "$url"
      - name: Tests
        run: |
          mkdir -p out/h
          javac -proc:none -encoding UTF-8 -d out/h $(find src/core harness -name '*.java')
          java -cp out/h com.ringdown.harness.ViewportTest | tee tests.log
          java -cp out/h com.ringdown.harness.RemoteTest remote/config.json REMOTE.md | tail -1 | tee -a tests.log
      - name: Build
        run: ./build.sh 2>&1 | tee build.log
      - name: Check the bundle
        run: |
          java -jar buildtools/bundletool.jar dump manifest --bundle out/aab/Ringdown.aab > manifest.txt
          grep -E 'versionCode|versionName' manifest.txt
      - name: Put the output on this branch
        if: always()
        run: |
          mkdir -p ci-out
          cp tests.log build.log manifest.txt ci-out/ 2>/dev/null || true
          if [ -f out/aab/Ringdown.aab ]; then cp out/aab/Ringdown.aab ci-out/Ringdown-1.3.2-ci.aab; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-out
          git commit -m "CI: 1.3.2 build output" || exit 0
          git push
